spring:
  application:
    name: iam-service
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000
      client:
        registration:
          github:
            provider: github
            client-name: Github
            client-id:
            client-secret:
            redirect-uri: {"baseUrl/login/oauth2/code/{registrationId}"}
          google:
            client-id:
            client-secret:
            client-name: Google
        provider:
          google:
            issuer-uri:
          github:
            issuer-uri:
  datasource:
    url: jdbc:postgresql://localhost:9543/db_oauth2
    username: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  liquibase:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    driver-class-name: ${spring.datasource.driver-class-name}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  port: 9000
