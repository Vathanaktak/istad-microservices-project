pluginManagement {
    includeBuild('../../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositories {
        mavenLocal()
        mavenCentral()
    }
    versionCatalogs {
        create("libs",{
            from(files("../../gradle/libs.versions.toml"))
        })
    }
}
rootProject.name = "iam-service"
include 'iam-domain:iam-domain-core'
include 'iam-domain:iam-application-service'
include 'iam-service-persistence'
include 'iam-service-main'
include 'iam-service-restapi'
include 'iam-service-web'
include 'iam-service-infrastructure'