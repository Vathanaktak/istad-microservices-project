server:
  port: 9000
  forward-headers-strategy: framework

spring:
  application:
    name: iam-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:9543/db_iam}
    username: ${DB_USERNAME:iteuser}
    password: ${DB_PASSWORD:qwerqwer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # schema is owned by Liquibase
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    problemdetails:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope: profile,email          # no "openid": keeps Google on the plain OAuth2 user-info flow
          github:
            client-id: ${GITHUB_CLIENT_ID:disabled}
            client-secret: ${GITHUB_CLIENT_SECRET:disabled}
            scope: read:user,user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:disabled}
            client-secret: ${FACEBOOK_CLIENT_SECRET:disabled}
            scope: public_profile,email

gg:
  jte:
    development-mode: false
    use-precompiled-templates: true

iam:
  issuer: ${IAM_ISSUER:http://localhost:9000}
  jwt:
    private-key: ${IAM_JWT_PRIVATE_KEY:}     # PKCS#8 base64; blank = ephemeral dev key
    public-key: ${IAM_JWT_PUBLIC_KEY:}       # X.509 base64
  dcr:
    client-id: ${IAM_DCR_CLIENT_ID:iam-dcr-initial}
    client-secret: ${IAM_DCR_CLIENT_SECRET:change-me-too}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
  admin:
    username: ${IAM_ADMIN_USERNAME:admin}
    email: ${IAM_ADMIN_EMAIL:admin@istad.co}
    password: ${IAM_ADMIN_PASSWORD:Adm1n!Pass2026}
