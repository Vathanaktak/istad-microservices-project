plugins {
    id 'spring-boot-common-conventions'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':iam-domain:iam-application-service')
    implementation project(':iam-domain:iam-domain-core')
    implementation project(':iam-service-persistence')
    implementation project(':iam-service-infrastructure')
    implementation project(':iam-service-restapi')
    implementation project(':iam-service-web')

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.liquibase
    runtimeOnly libs.postgresql

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers:3.4.1'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure:3.4.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.1'
    testRuntimeOnly libs.junit.platform.launcher
}
