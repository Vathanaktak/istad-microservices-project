plugins {
    id 'spring-boot-common-conventions'
}

dependencies {
    // Core dependency for building web applications (includes Tomcat and Spring MVC)
    implementation libs.spring.boot.starter.web

    // Recommended: Production-ready features like health checks and monitoring
    implementation libs.spring.boot.starter.actuator

    // Testing framework (Includes JUnit, Mockito, and Spring Test utilities)
    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('bootJar') {
    enabled = false
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('kh.edu.istad:payment-domain-core') using project(':payment-service-domain:payment-domain-core')
            substitute module('kh.edu.istad:payment-application-service') using project(':payment-service-domain:payment-application-service')
            substitute module('kh.edu.istad:payment-service-restapi') using project(':payment-service-restapi')
            substitute module('kh.edu.istad:payment-service-persistence') using project(':payment-service-persistence')
            substitute module('kh.edu.istad:payment-service-message') using project(':payment-service-message')
        }
    }
}
