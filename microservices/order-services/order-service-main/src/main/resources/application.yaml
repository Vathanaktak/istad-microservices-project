  application:
    name: order-service
  profiles:
    active: dev
  config:
    import:
      - "optional:consul:"
  security:
    oauth2:
      client:
        registration:
          customer-client:
            client-id: customer-client
            client-secret: customer-secret
            authorization-grant-type: client_credentials
            scope:
              - read
              - write
            client-authentication-method: client_secret_basic
        provider:
          customer-client:
#            issuer-uri: http://localhost:9000
            token-uri: http://127.0.0.1:9000/oauth2/token
  cloud:
    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        service-name: order-service
        instance-id: ${spring.application.name}-${random.value}
        prefer-ip-address: true
      config:
        format: yaml
#        prefixes: config
#        data-key: data
        watch:
          enabled: true
        enabled: true
  http:
    serviceclient:
      customer-service:
        base-url: http://customer-service
      business-service:
        base-url: http://business-service
  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    user: iteuser
    password: qwerqwer
    url: jdbc:postgresql://localhost:9543/db_order
    driver-class-name: org.postgresql.Driver
    change-log: classpath:/db/changelog/db.changelog-master.yaml
