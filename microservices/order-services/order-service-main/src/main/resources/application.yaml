logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web.reactive.function.client: TRACE
    org.springframework.security.oauth2: TRACE
server:
  port: 8080

spring:
#  datasource:
#    url: jdbc:postgresql://localhost:5433/product_db
#    username: postgres
#    password: postgres@istad
