server:
  port: 8081

spring:
  application:
    name: order-service
  profiles:
    active: dev
  config:
    import:
      - "optional:consul:"
  cloud:
    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        service-name: order-service
        instance-id: ${spring.application.name}-${random.value}
        prefer-ip-address: true
      config:
        format: yaml
        watch:
          enabled: true
        enabled: true
  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    user: iteuser
    password: qwerqwer
    url: jdbc:postgresql://localhost:9543/db_order
    driver-class-name: org.postgresql.Driver
    change-log: classpath:/db/changelog/db.changelog-master.yaml

http:
  serviceclient:
    customer-service:
      connect-timeout:
        seconds: 5
      read-timeout:
        seconds: 10
      base-url: http://customer-service

grpc:
  client:
    product-service:
      address: 'static://localhost:9095'
      negotiation-type: plaintext
