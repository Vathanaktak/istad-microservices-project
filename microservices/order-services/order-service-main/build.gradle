plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}
ext {
    springCloudVersion = "2025.1.4"
}

dependencies {
    implementation libs.istad.common.swagger

    implementation libs.order.app.service
    implementation libs.order.message
    implementation libs.order.persistence
    implementation libs.order.core
    implementation libs.order.restapi
    implementation libs.order.client

    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.cloud.starter.consul.discovery
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.cloud.starter.consul.config

    implementation libs.spring.boot.starter.liquibase
    runtimeOnly libs.postgresql
    runtimeOnly libs.r2dbc.postgresql
}
