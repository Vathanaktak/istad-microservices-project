plugins {
    id 'sping-common-conventions'
    id 'spring-cloud-common-conventions'
}
ext {
    springCloudVersion = "2025.1.4"
}

bootJar {
    enabled = false
}

dependencies {
    api libs.order.app.service

    api libs.spring.boot.starter.webclient
    api libs.spring.cloud.starter.loadbalancer
    api libs.spring.boot.starter.oauth2.client
    compileOnly libs.spring.boot.starter.webmvc
}
