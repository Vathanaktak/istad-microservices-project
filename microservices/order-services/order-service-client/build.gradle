plugins {
    id 'sping-common-conventions'
    id 'spring-cloud-common-conventions'
}
ext {
    springCloudVersion = "2025.1.4"
}

dependencies {
    api libs.order.app.service

    // Lombok
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // gRPC Client Starter
    implementation libs.grpc.client.spring.boot.starter
    implementation 'kh.edu.istad:istad-common-grpc'

    implementation libs.reactor.core
    implementation libs.spring.boot.starter.webflux
    implementation libs.spring.boot.starter.webclient
    implementation libs.spring.cloud.starter.loadbalancer
}
