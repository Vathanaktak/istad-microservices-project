server:
  port: 9090

spring:
  application:
    name: business-service
  mongodb:
    uri: mongodb://mongod:mongod@localhost:2026/db_customer?authSource=admin
    representation:
      uuid: standard
  data:
    mongodb:
      representation:
        uuid: standard

eureka:                          # NEW
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:                      # NEW
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: hardcoded
eureka:
  client:
    enabled: false