
plugins {
    id 'spring-boot-common-conventions'
}

dependencies {
    implementation 'kh.edu.istad:business-application-service'
    implementation 'kh.edu.istad:business-service-message'
    implementation 'kh.edu.istad:business-service-persistence'
    implementation 'kh.edu.istad:business-domain-core'
    implementation 'kh.edu.istad:business-service-restapi'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
//    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'


    implementation 'org.springframework.boot:spring-boot-starter-actuator'                  // NEW
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'   // NEW

}