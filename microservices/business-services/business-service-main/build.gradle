plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {
    implementation libs.istad.common.webflux

    implementation libs.business.app.service
    implementation libs.business.message
    implementation libs.business.persistence
    implementation libs.business.core
    implementation libs.business.restapi

    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.webflux

    implementation libs.spring.cloud.starter.consul.discovery
    implementation libs.spring.cloud.starter.consul.config
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

}
