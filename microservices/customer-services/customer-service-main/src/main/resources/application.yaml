server:
  port: 9091
spring:
  application:
    name: customer-service
  mongodb:
    uri: mongodb://mongod:mongod@localhost:2026/db_customer?authSource=admin
    representation:
      uuid: standard
  data:
    mongodb:
      representation:
        uuid: standard

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: false
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
