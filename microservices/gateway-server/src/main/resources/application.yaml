server:
  port: 9095
spring:
  application:
    name: gateway-server
  profiles:
    active: dev
  config:
    import:
      - "optional:consul:"
  cloud:
    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        service-name: gateway-server
        instance-id: ${spring.application.name}-${random.value}
        prefer-ip-address: true
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: my-order-service
              uri: lb://order-service
              predicates:
                - Path=/my-orders/**
#                - SaveSession
              filters:
                - RewritePath=/my-orders/?(?<segment>.*), /$\{segment}
            - id: json-placeholder
              uri: https://jsonplaceholder.typicode.com/comments
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
            - id: nextjs
              uri: http://localhost:3001
              predicates:
                - Path=/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
      client:
        provider:
          iam-service:
            issuer-uri: http://localhost:9000
        registration:
          front-bff-client:
            provider: iam-service
            client-id: front-bff-client
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:9095/login/oauth2/code/front-bff-client
            scope:
              - openid
              - profile
management:
  endpoints:
    web:
      exposure:
        include: "health,gateway"
  endpoint:
    gateway:
      access: read_only
