plugins {
    id 'maven-publish'
}

group = 'kh.edu.istad'


dependencies {

}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Vathanaktak/istad-microservices-project")
            credentials {
                username = providers.gradleProperty("gpr.user").getOrNull() ?: System.getenv("USERNAME")
                password = providers.gradleProperty("gpr.key").getOrNull() ?: System.getenv("TOKEN")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            from(components.java)
        }
    }
}
