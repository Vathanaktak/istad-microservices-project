version: v2

modules:
  - path: src/main/proto

lint:
  use:
    - STANDARD
  except:
    # Allowed exceptions to preserve backwards-compatibility with existing Java services
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME

breaking:
  use:
    - FILE
