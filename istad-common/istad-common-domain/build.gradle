plugins {
    id 'java-common-conventions'
    id 'java-publishcation'
}

group = 'kh.edu.istad'
version = '1.0.2'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
}
