version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: order-service-db
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order-service
      POSTGRES_DB: order-db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
