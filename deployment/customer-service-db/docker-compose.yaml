version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: customer-service-db
    environment:
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer-service
      POSTGRES_DB: customer-db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
